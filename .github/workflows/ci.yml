name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SKIP_ENV_VALIDATION: "1"
          # 32 zero bytes — satisfies lib/crypto's assertEncryptionKeyForBoot
          # during Next.js' production page-data collection. CI never decrypts
          # anything; this key only exists so the build can complete. Real
          # secrets are decrypted only by the running service in prod with
          # the real key.
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: npm run build
